<style>
:root{--bg:#09070b;--panel:#121017;--gold:#e7b94e;--gold2:#ffd978;--text:#f8f4ec;--muted:#aaa3b1;--line:rgba(255,215,120,.16)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#2a1b0c,#09070b 42%,#07060a);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
a{text-decoration:none;color:inherit}button,input{font:inherit}.nav{position:sticky;top:0;z-index:20;background:#09070bf2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.navin{max-width:1200px;margin:auto;padding:10px 18px;min-height:70px;display:flex;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;font:700 20px Georgia,serif}.logo{width:48px;height:48px;border-radius:50%;object-fit:contain;background:#050408;border:1px solid var(--gold)}.home{margin-left:auto;border:1px solid var(--line);padding:10px 14px;border-radius:10px}
.wrap{max-width:1200px;margin:auto;padding:30px 18px 60px}.crumb{color:var(--muted);font-size:12px;margin-bottom:18px}.product{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px}
.gallery{min-width:0}.mainImg{aspect-ratio:1/1;background:#050408;border:1px solid var(--line);border-radius:22px;display:grid;place-items:center;overflow:hidden}.mainImg img{width:100%;height:100%;object-fit:contain}.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 2px}.thumb{flex:0 0 72px;height:72px;border:1px solid var(--line);border-radius:10px;background:#050408;overflow:hidden;cursor:pointer}.thumb img{width:100%;height:100%;object-fit:cover}.thumb.active{border-color:var(--gold)}
.meta{color:var(--gold2);font-size:12px;letter-spacing:1px;text-transform:uppercase}.title{font:700 clamp(30px,4vw,52px)/1.05 Georgia,serif;margin:10px 0 14px}.price{font-size:30px;font-weight:900}.mrp{text-decoration:line-through;color:#777;margin-left:8px;font-size:14px}.stock{margin:12px 0;font-weight:700}.in{color:#6fe59f}.out{color:#ff8888}.desc,.specs{color:#bdb6c0;line-height:1.8;white-space:pre-wrap}.panel{border:1px solid var(--line);background:#0f0c12;border-radius:18px;padding:18px;margin-top:18px}.panel h3{margin:0 0 10px;font-family:Georgia,serif}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:22px}.btn{display:flex;align-items:center;justify-content:center;padding:13px 12px;border:1px solid var(--line);border-radius:11px;background:#15111a;font-weight:800;text-align:center}.wa{background:#0d2116;border-color:#1c6f39;color:#8cf2b2}.gold{background:linear-gradient(135deg,#c89228,#f2cf70);color:#1b1204;border:0}.error{padding:40px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:#aaa}
@media(max-width:800px){.product{grid-template-columns:1fr}.wrap{padding:20px 12px 40px}.actions{grid-template-columns:1fr}.title{font-size:34px}.mainImg{max-height:65vh}.home{padding:9px 11px;font-size:12px}}

/* Marketplace action styling */
.productActions,.actions{display:flex;gap:8px;flex-wrap:wrap}
.productActions .btn,.actions .btn{flex:1;min-width:120px}
.btnWishlist{background:#fff!important;color:#e91e63!important;border:1px solid #e91e63!important;font-weight:900!important}
.btnWishlist:hover{background:#ffe7f0!important}
.btnMeesho{background:#ff4f9a!important;color:#fff!important;border:1px solid #ff4f9a!important;font-weight:900!important}
.btnAmazon{background:#ff9900!important;color:#111!important;border:1px solid #ff9900!important;font-weight:900!important}
.btnWhatsApp{background:#18a957!important;color:#fff!important;border:1px solid #18a957!important;font-weight:900!important}
@media(max-width:560px){.productActions,.actions{display:grid;grid-template-columns:1fr 1fr}.productActions .btn,.actions .btn{min-width:0}}


/* FINAL-FINAL: reliable logo */
.logo,#loginLogo,#sideLogo,.logoPreview{
  object-fit:contain!important;display:block!important;
  border-radius:50%!important;border:1px solid #d9aa32!important;
}

<style id="phase12-product-css">.productTools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.shareBtn{border:1px solid var(--line);background:#15111a;color:#fff;border-radius:10px;padding:11px 13px;font-weight:800}.related{margin-top:35px}.relatedGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.reviewList{display:grid;gap:10px}.reviewItem{border:1px solid var(--line);border-radius:12px;padding:12px;background:#0f0c12}.stars{color:#ffd978;letter-spacing:2px}.viewer{position:fixed;inset:0;background:#000e;z-index:999;display:none;align-items:center;justify-content:center;padding:20px}.viewer.open{display:flex}.viewer img{max-width:95vw;max-height:90vh;object-fit:contain}.viewer button{position:absolute;right:20px;top:15px;background:none;border:0;color:#fff;font-size:34px}@media(max-width:700px){.relatedGrid{grid-template-columns:1fr 1fr}}</style><style id="phase3-product-css">.btnBuyNow{background:linear-gradient(135deg,#c89228,#f2cf70)!important;color:#1b1204!important;border:0!important;font-weight:900!important}.btnAddCart{background:#17131c!important;color:#fff!important;border:1px solid rgba(255,215,120,.24)!important;font-weight:900!important}.btnWishlist{background:linear-gradient(135deg,#8b1f4f,#ff4f9a)!important;color:#fff!important;border:1px solid #ff78b5!important;box-shadow:0 8px 24px #ff4f9a22!important}.btnWishlist:hover{background:linear-gradient(135deg,#a5285e,#ff66aa)!important}</style><style id="FINAL-PREMIUM-UI">/* FINAL-PREMIUM-UI */

button,.btn,.mini,a.btn{background:linear-gradient(135deg,#5a356d,#8d4f9f)!important;color:#fff!important;border:1px solid rgba(255,215,120,.34)!important;box-shadow:0 8px 22px rgba(75,36,90,.20)}

.btn.gold,.mini.gold{background:linear-gradient(135deg,#b77a18,#f3ca61)!important;color:#1a1002!important;border-color:#f3ca61!important}
.heartDetail{width:46px;height:46px;border-radius:50%;font-size:24px;padding:0;display:inline-flex;align-items:center;justify-content:center}.btnWishlist,.btnWishlist:visited{background:linear-gradient(135deg,#a72c63,#ff4f9a)!important;color:#fff!important;border-color:#ff78b5!important}
.btnMeesho{background:linear-gradient(135deg,#e83e88,#ff75b3)!important;color:#fff!important}
.btnAmazon{background:linear-gradient(135deg,#ff8a00,#ffb347)!important;color:#251300!important}
.btnWhatsApp,.btn.wa{background:linear-gradient(135deg,#159447,#2ed47a)!important;color:#052713!important;border-color:#55e99a!important}
.phase3Cart{background:linear-gradient(135deg,#5b3c9d,#8b65e8)!important;color:#fff!important}
.phase3Buy{background:linear-gradient(135deg,#b77a18,#f3ca61)!important;color:#1a1002!important}
#accountBtn{background:linear-gradient(135deg,#5b3c9d,#8b65e8)!important}
#wishlistBtn{background:linear-gradient(135deg,#a72c63,#ff4f9a)!important;color:#fff!important;border-color:#ff78b5!important}
#cartBtn{background:linear-gradient(135deg,#a86d15,#e7b94e)!important;color:#1a1002!important}
.accountTabs .btn{background:linear-gradient(135deg,#5a356d,#8d4f9f)!important;color:#fff!important}
.accountTabs .btn.active,.accountTabs .btn:hover{background:linear-gradient(135deg,#b77a18,#f3ca61)!important;color:#1a1002!important}
.orderActions .btn{background:linear-gradient(135deg,#5a356d,#8d4f9f)!important;color:#fff!important}
.orderActions .btn.danger{background:linear-gradient(135deg,#a3264d,#ef557d)!important;color:#fff!important}
.orderActions .btn.success{background:linear-gradient(135deg,#159447,#2ed47a)!important;color:#052713!important}
.accountPane .rowItem .btn{background:linear-gradient(135deg,#5a356d,#8d4f9f)!important;color:#fff!important}
.close{background:linear-gradient(135deg,#5a356d,#8d4f9f)!important;color:#fff!important;border:1px solid rgba(255,215,120,.3)!important;border-radius:9px!important;width:38px;height:38px}
#accountDashboardModal .modalBox{background:linear-gradient(145deg,#120d18,#20131f 55%,#0d0a11)!important}
#accountDashboardModal .accountPane{background:linear-gradient(145deg,#17111f,#100c16)!important;border-color:rgba(255,215,120,.16)!important}
#accountDashboardModal .dashCard{background:linear-gradient(145deg,#241629,#15101c)!important}
#accountDashboardModal .rowItem{background:linear-gradient(145deg,#20152a,#120d18)!important}

#accountDashboardModal .orderStat{background:linear-gradient(145deg,#24182a,#14101a)!important}
#accountDashboardModal .field,.modalBox .field{background:#17101e!important;color:#fff!important;border-color:rgba(255,215,120,.28)!important}
#accountDashboardModal .panel{background:linear-gradient(145deg,#17111f,#0f0b15)!important}
#cartCount,#wishCount{background:linear-gradient(135deg,#f0c55e,#ffd978)!important;color:#241300!important}
.cardBtns{grid-template-columns:1fr 1fr}

 const first=images[0]||fallback;
 document.title='Madhu Enterprises | '+p.name;
 $('app').innerHTML=`
 <div class="crumb"><a href="./index.html">Home</a> / ${esc(p.category||'Product')}</div>
 <div class="product">
  <section class="gallery">
   <div class="mainImg"><img id="mainImg" src="${esc(first)}" alt="${esc(p.name)}"></div>
   <div class="thumbs" id="thumbs"></div>
  </section>
  <section>
   <div class="meta">${esc(p.brand||'Madhu Enterprises')} • ${esc(p.category||'')}</div>
   <h1 class="title">${esc(p.name)}</h1>
   <div><span class="price">${money(p.price)}</span>${p.mrp?`<span class="mrp">${money(p.mrp)}</span>`:''}</div>
   <div class="stock ${Number(p.stock)>0?'in':'out'}">${Number(p.stock)>0?'● In Stock':'● Out of Stock'}</div>
   <p class="desc">${esc(p.description||'No description added yet.')}</p>
   <div class="actions">
    <a class="btn btnWhatsApp wa" target="_blank" rel="noopener" href="${wa(p,phone)}">💬 Buy on WhatsApp</a>
    <button class="btn btnWishlist heartDetail" id="detailWish" type="button" aria-label="Wishlist" title="Wishlist">♡</button>
    ${p.meesho?`<a class="btn btnMeesho" target="_blank" rel="noopener" href="${esc(p.meesho)}">M Meesho</a>`:''}
    ${p.amazon?`<a class="btn btnAmazon" target="_blank" rel="noopener" href="${esc(p.amazon)}">🛒 Amazon</a>`:''}
   </div>
   <div class="panel"><h3>Specifications</h3><div class="specs">${esc(p.specs||'Specifications will be added soon.')}</div></div>
  </section>
 </div>`;

 const wish=$('detailWish');
 async function syncWish(){
   if(!wish)return;
   const {data:{user}}=await sb.auth.getUser();
   if(!user){wish.textContent='♡';return;}
   const {data}=await sb.from('wishlists').select('id').eq('user_id',user.id).eq('product_id',p.id).maybeSingle();
   wish.textContent=data?'♥':'♡';wish.classList.toggle('active',!!data);
 }
 if(wish)wish.onclick=async()=>{
   const {data:{user}}=await sb.auth.getUser();
   if(!user){alert('Please login to use Wishlist.');return;}
   const {data:existing}=await sb.from('wishlists').select('id').eq('user_id',user.id).eq('product_id',p.id).maybeSingle();
   if(existing){await sb.from('wishlists').delete().eq('id',existing.id);}
   else{const {error}=await sb.from('wishlists').insert({user_id:user.id,product_id:p.id});if(error){alert(error.message);return;}}
   syncWish();
 };
 syncWish();

 const thumbs=$('thumbs');
 (images.length?images:[fallback]).forEach((u,i)=>{
   const b=document.createElement('button');b.className='thumb'+(i===0?' active':'');b.type='button';
   const im=document.createElement('img');im.src=u;im.alt='Product image '+(i+1);
   b.appendChild(im);b.onclick=()=>{$('mainImg').src=u;document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));b.classList.add('active')};
   thumbs.appendChild(b);

<script id="phase12-product">
(()=>{
 const R='madhu_recent_v1';
 const toast=m=>{let t=document.getElementById('phaseToast');if(!t){t=document.createElement('div');t.id='phaseToast';t.style='position:fixed;right:18px;top:90px;z-index:1000;background:#19141e;border:1px solid #e7b94e;padding:12px 16px;border-radius:10px;color:#fff';document.body.appendChild(t)}t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
 const safe=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
 function wait(){const app=document.getElementById('app');if(!app||!document.getElementById('detailWish'))return setTimeout(wait,250); enhance();}
 async function enhance(){
  const title=document.getElementById('detailName')?.textContent||''; const id=new URLSearchParams(location.search).get('id'); if(!id)return;
  const {data:p}=await sb.from('products').select('*').eq('id',id).maybeSingle(); if(!p)return;
  const {data:settings}=await sb.from('site_settings').select('*').eq('id',1).maybeSingle();
  let recent=[];try{recent=JSON.parse(localStorage.getItem(R)||'[]')}catch{};recent=[String(id),...recent.filter(x=>String(x)!==String(id))].slice(0,12);localStorage.setItem(R,JSON.stringify(recent));
  try{await sb.from('product_views').insert({product_id:id});}catch{}
  const actions=document.querySelector('.actions'); if(actions&&!document.getElementById('shareProductBtn')){const b=document.createElement('button');b.id='shareProductBtn';b.className='shareBtn';b.textContent='↗ Share Product';actions.appendChild(b);b.onclick=()=>shareProduct(p)}
  const gallery=document.querySelector('.mainImg');if(gallery&&!gallery.dataset.viewer){gallery.dataset.viewer='1';gallery.style.cursor='zoom-in';gallery.onclick=()=>{let v=document.getElementById('imgViewer');if(!v){v=document.createElement('div');v.id='imgViewer';v.className='viewer';v.innerHTML='<button>×</button><img>';document.body.appendChild(v);v.querySelector('button').onclick=()=>v.classList.remove('open');v.onclick=e=>{if(e.target===v)v.classList.remove('open')}}v.querySelector('img').src=document.getElementById('mainImg').src;v.classList.add('open')}}
  const root=document.querySelector('.product');if(root&&!document.getElementById('reviewPanel')){const side=document.createElement('section');side.id='reviewPanel';side.className='panel';side.innerHTML='<h3>⭐ Customer Reviews</h3><div id="reviewList" class="reviewList">Loading reviews…</div><div id="reviewGate" class="reviewBox" style="margin-top:14px">Checking review eligibility…</div>';root.parentElement.appendChild(side);await renderReviews(p.id);await renderReviewGate(p.id)}
  if(!document.getElementById('relatedPanel')){const sec=document.createElement('section');sec.id='relatedPanel';sec.className='related';sec.innerHTML='<h2 style="font-family:Georgia,serif">Related Products</h2><div id="relatedGrid" class="relatedGrid"></div>';document.querySelector('.wrap').appendChild(sec);const r=await sb.from('products').select('*').eq('published',true).eq('category',p.category).neq('id',p.id).limit(4);document.getElementById('relatedGrid').innerHTML=(r.data||[]).map(x=>`<a class="panel" href="./product.html?id=${encodeURIComponent(x.id)}"><b>${safe(x.name)}</b><div class="note">${safe(x.brand||'')} • ₹${Number(x.price||0).toLocaleString('en-IN')}</div></a>`).join('')||'<div class="note">No related products yet.</div>'}
  
 }
 async function renderReviewGate(id){const gate=document.getElementById('reviewGate');if(!gate)return;const {data:{user}}=await sb.auth.getUser();if(!user){gate.innerHTML='<div class="note">Only customers who have received this product can review it. Please login to check eligibility.</div>';return}const r=await sb.rpc('can_review_product',{p_product_id:id});if(r.error){gate.innerHTML='<div class="note">Review eligibility is temporarily unavailable. Please try again later.</div>';return}if(!r.data){gate.innerHTML='<div class="note">⭐ Reviews can be submitted only after your order containing this product is marked Delivered.</div>';return}gate.innerHTML='<b>Write a review</b><div style="display:flex;gap:8px;margin:10px 0"><select id="reviewRating" class="btn"><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select></div><textarea id="reviewText" class="miniInput" placeholder="Share your experience"></textarea><button id="reviewSubmit" class="btn gold" style="margin-top:8px">Submit Review</button>';document.getElementById('reviewSubmit').onclick=async()=>{const rating=Number(document.getElementById('reviewRating').value);const review_text=document.getElementById('reviewText').value.trim();if(!review_text){toast('Please write your review.');return}const r=await sb.rpc('submit_product_review',{p_product_id:id,p_rating:rating,p_review_text:review_text});toast(r.error?r.error.message:'Review submitted for approval.');if(!r.error){await renderReviews(id);await renderReviewGate(id)}}}
 async function renderReviews(id){const box=document.getElementById('reviewList');if(!box)return;const r=await sb.from('reviews').select('rating,review_text,created_at,status,profiles(name)').eq('product_id',id).eq('status','approved').order('created_at',{ascending:false});box.innerHTML=(r.data||[]).map(x=>`<div class="reviewItem"><div class="stars">${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</div><b>${safe(x.profiles?.name||'Customer')}</b><div class="note">${safe(x.review_text||'')}</div></div>`).join('')||'<div class="note">No approved reviews yet.</div>'}
 async function shareProduct(p){const url=location.href, text=`Madhu Enterprises – ${p.name}\n₹${Number(p.price||0).toLocaleString('en-IN')}\n${url}`;try{await sb.from('product_shares').insert({product_id:p.id,channel:'share'});}catch{}if(navigator.share){try{await navigator.share({title:'Madhu Enterprises – '+p.name,text,url});return}catch{}}const menu=document.createElement('div');menu.className='viewer open';menu.innerHTML=`<div style="background:#111018;border:1px solid #e7b94e;border-radius:18px;padding:20px;max-width:420px;width:100%"><h3>Share Product</h3><div class="productTools"><a class="shareBtn" target="_blank" href="https://wa.me/?text=${encodeURIComponent(text)}">WhatsApp</a><a class="shareBtn" target="_blank" href="mailto:?subject=${encodeURIComponent('Madhu Enterprises – '+p.name)}&body=${encodeURIComponent(text)}">Email</a><button class="shareBtn" id="copyShare">Copy Link</button></div></div>`;document.body.appendChild(menu);menu.onclick=e=>{if(e.target===menu)menu.remove()};menu.querySelector('#copyShare').onclick=async()=>{await navigator.clipboard?.writeText(url);toast('Product link copied');menu.remove()}}
 wait();
})();
</script>
<script id="phase3-product">
(()=>{
 const CART='madhu_cart_v3';const get=()=>{try{return JSON.parse(localStorage.getItem(CART)||'[]')}catch{return[]}};const put=c=>localStorage.setItem(CART,JSON.stringify(c));
 const wait=()=>{const b=document.getElementById('detailWish');if(!b)return setTimeout(wait,250);const actions=b.parentElement;if(!actions||actions.dataset.p3)return;actions.dataset.p3='1';const id=new URLSearchParams(location.search).get('id');const add=document.createElement('button');add.className='btn btnAddCart';add.textContent='🛒 Add to Cart';add.onclick=()=>{const c=get(),i=c.findIndex(x=>String(x.id)===String(id));if(i>=0)c[i].qty=Math.min(99,Number(c[i].qty)+1);else c.push({id:String(id),qty:1});put(c);alert('Added to cart');};const buy=document.createElement('button');buy.className='btn btnBuyNow';buy.textContent='⚡ Buy Now';buy.onclick=()=>{const c=get(),i=c.findIndex(x=>String(x.id)===String(id));if(i>=0)c[i].qty=1;else c.push({id:String(id),qty:1});put(c);location.href='./checkout.html'};actions.insertBefore(add,b);actions.insertBefore(buy,b);};wait();
})();
</script>
